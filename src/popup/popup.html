<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuietScroll</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="header">
        <img src="../../icons/icon.svg" alt="" class="logo" width="24" height="24" />
        <div>
          <h1 class="title">QuietScroll</h1>
          <p class="subtitle" id="status-text">Active</p>
        </div>
      </header>

      <label class="toggle-row" for="enabled-toggle">
        <span class="toggle-label">Auto-mute on scroll</span>
        <span class="switch">
          <input type="checkbox" id="enabled-toggle" checked />
          <span class="slider"></span>
        </span>
      </label>

      <p class="hint">
        Unmuted videos stay audible while in view. Scrolling to the next video resets audio to muted.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
